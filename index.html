<!DOCTYPE html>
<html>
<head>
  <title>Metro Ticket Discount</title>
</head>
<body>
  <h2>Metro Ticket Fare Calculator</h2>

  <label>Base fare (₹): </label>
  <input type="number" id="fare" value="40"><br><br>

  <label>Age: </label>
  <input type="number" id="age"><br><br>

  <label>Gender: </label>
  <select id="gender">
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select><br><br>

  <button onclick="calculate()">Calculate</button>

  <p id="result"></p>

  <script>
    function calculate() {
      var fare = Number(document.getElementById("fare").value);
      var age = Number(document.getElementById("age").value);
      var gender = document.getElementById("gender").value;

      var discount = 0;

      if (gender === "female") {
        discount = Math.max(discount, 50);
      }

      if (age < 5) {
        discount = Math.max(discount, 100);
      } else if (age <= 8) {
        discount = Math.max(discount, 50);
      }

      if (age > 65) {
        discount = Math.max(discount, 70);
      }

      var finalFare = fare * (1 - discount / 100);

      document.getElementById("result").innerText =
        "Discount: " + discount + "% | Final fare: ₹" + finalFare;
    }
  </script>
</body>
</html>
